<script>document.documentElement.classList.add('js');</script>
<style>
:root{
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Sans Arabic','Noto Naskh Arabic',system-ui,sans-serif;
  --font-d:'Reem Kufi','IBM Plex Sans Arabic','Noto Kufi Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --r1:10px;--r2:16px;--r3:24px;--r4:32px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --bg:#F3F7F5;--bg2:#E9F1ED;--surface:#FFFFFF;--surface2:#EEF4F1;--line:#D9E4DF;--line2:#BFD0C8;
  --ink:#0C2420;--ink2:#4A645D;--ink3:#7A8F89;
  --brand:#0B7F63;--brand2:#12A27E;--brand-d:#08604B;--on-brand:#FFFFFF;--brand-soft:rgba(11,127,99,.10);--brand-line:rgba(11,127,99,.35);
  --gold:#A96F00;--gold-fill:#F4B73A;--gold-soft:rgba(244,183,58,.20);
  --ok:#0F7F57;--ok-soft:#DCF3E8;--bad:#BE3328;--bad-soft:#FBE4E0;--info:#2C66D4;--info-soft:#E3ECFB;
  --shadow:0 1px 2px rgba(12,36,32,.05),0 8px 24px rgba(12,36,32,.06);
  --shadow-lg:0 2px 6px rgba(12,36,32,.06),0 28px 64px rgba(12,36,32,.14);
  --grid:rgba(12,36,32,.05);--glow:rgba(18,162,126,.20);--glow2:rgba(244,183,58,.16);
  --card-hi:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#08110F;--bg2:#0C1916;--surface:#101E1A;--line:#213630;--line2:#2F4A42;
  --ink:#E8F3EE;--ink2:#9DB6AE;--ink3:#6C8880;
  --brand:#34D3A1;--brand2:#5BE3B8;--brand-d:#1BA77D;--on-brand:#03211A;--brand-soft:rgba(52,211,161,.12);--brand-line:rgba(52,211,161,.38);
  --gold:#F5C04A;--gold-fill:#F5C04A;--gold-soft:rgba(245,192,74,.16);
  --ok:#4ADE9B;--ok-soft:#12362A;--bad:#FF8173;--bad-soft:#3C1E1A;--info:#86ABFF;--info-soft:#1A2848;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.28);
  --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 30px 70px rgba(0,0,0,.5);
  --grid:rgba(120,200,170,.055);--glow:rgba(52,211,161,.16);--glow2:rgba(245,192,74,.09);
  --card-hi:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0));
  color-scheme:dark;
}
html[data-theme="dark"]{--surface2:#162823}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.85 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden;min-height:100vh;transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(900px 520px at 88% -8%,var(--glow),transparent 62%),
   radial-gradient(700px 420px at 4% 18%,var(--glow2),transparent 62%),
   repeating-linear-gradient(0deg,transparent 0 31px,var(--grid) 31px 32px),
   repeating-linear-gradient(90deg,transparent 0 31px,var(--grid) 31px 32px);
  -webkit-mask-image:linear-gradient(180deg,#000 30%,rgba(0,0,0,.25) 100%);mask-image:linear-gradient(180deg,#000 30%,rgba(0,0,0,.25) 100%)}
h1,h2,h3,h4,p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:8px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;background:var(--brand);color:var(--on-brand);padding:8px 14px;border-radius:10px;z-index:200;transition:top .2s}
.skip:focus{top:10px}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor}
.ic.sm{width:16px;height:16px}.ic.lg{width:28px;height:28px}
.muted{color:var(--ink2)}
.wrap{width:min(1120px,calc(100% - 32px));margin-inline:auto}
bdi{unicode-bidi:isolate}
#view{outline:none;min-height:70vh}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:120}

/* ---------- header / nav ---------- */
.hdr{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hdr-in{width:min(1120px,calc(100% - 32px));margin-inline:auto;height:66px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{width:36px;height:36px;border-radius:11px;box-shadow:0 6px 18px rgba(18,162,126,.35)}
.brand-name{font-family:var(--font-d);font-weight:700;font-size:1.6rem;letter-spacing:0;line-height:1}
.nav{display:flex;gap:4px;margin-inline-start:12px;flex:1}
.nav a{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;color:var(--ink2);font-weight:500;font-size:.98rem;position:relative;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{color:var(--brand);background:var(--brand-soft)}
.hdr-act{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:transform .15s,border-color .2s,background .2s}
.icon-btn:hover{border-color:var(--brand-line);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.96)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-weight:600;font-size:.9rem;line-height:1.6;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip .ic{width:16px;height:16px}
.chip-gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold-fill) 45%,transparent);background:var(--gold-soft)}
.chip-flame{color:#E2652D}
html[data-theme="dark"] .chip-flame{color:#FF9A62}
.chip-brand{color:var(--brand);background:var(--brand-soft);border-color:var(--brand-line)}
.tabbar{display:none}
@media (max-width:820px){
  .nav,#dayChip{display:none}
  .hdr-in{height:58px;gap:10px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset-inline:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--ink3);font-size:.74rem;font-weight:500;line-height:1.4}
  .tabbar a.on{color:var(--brand)}
  .tabbar a.on .ic{transform:translateY(-1px) scale(1.08)}
  #view{padding-bottom:84px}
}
body.focus .hdr,body.focus .tabbar{display:none}
body.focus #view{padding-bottom:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:10px 22px;border-radius:14px;border:1.5px solid transparent;font-weight:600;font-size:1rem;line-height:1.4;transition:transform .15s var(--ease),box-shadow .2s,background .2s,border-color .2s,filter .2s;text-align:center}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand2),var(--brand));color:var(--on-brand);box-shadow:0 8px 22px color-mix(in srgb,var(--brand) 38%,transparent)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 28px color-mix(in srgb,var(--brand) 46%,transparent)}
.btn-soft{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn-soft:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn-ghost{background:transparent;color:var(--ink2)}
.btn-ghost:hover:not(:disabled){background:var(--surface2);color:var(--ink)}
.btn-danger{background:transparent;border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn-danger:hover{background:var(--bad-soft)}
.btn-lg{min-height:56px;padding:12px 30px;font-size:1.08rem;border-radius:16px}
.btn-sm{min-height:38px;padding:6px 14px;font-size:.92rem;border-radius:11px}
.btn:disabled{opacity:.45}
.btn .ic{width:20px;height:20px}

/* ---------- common blocks ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--brand);font-weight:600;font-size:.9rem}
.eyebrow::before{content:"";width:22px;height:7px;border-block:2px solid currentColor;flex:none}
.sec{padding:72px 0 0}
.sec-h{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:680px}
.sec-h h2{font-family:var(--font-d);font-weight:700;font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.35}
.sec-h p{color:var(--ink2)}
.card{background:var(--surface);background-image:var(--card-hi);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--shadow)}
.dbl{border-inline-start:6px double var(--brand)}
.reveal{opacity:1;transform:none}
html.js .reveal:not(.in){opacity:0;transform:translateY(18px)}
.reveal{transition:opacity .7s var(--ease),transform .7s var(--ease)}

/* ---------- hero ---------- */
.hero{padding:44px 0 8px}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}
.hero-copy{display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.hero h1{font-family:var(--font-d);font-weight:700;font-size:clamp(2.3rem,6.2vw,4.1rem);line-height:1.28}
.hero h1 em{font-style:normal;color:var(--brand);position:relative;white-space:nowrap}
.hero h1 em::after{content:"";position:absolute;inset-inline:0;bottom:-.1em;height:.2em;border-block:3px solid var(--gold-fill);opacity:.9}
.lead{font-size:1.14rem;color:var(--ink2);max-width:56ch;line-height:1.95}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.trust{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:.92rem}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust .ic{width:18px;height:18px;color:var(--brand)}
.resume{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:18px;background:var(--brand-soft);border:1px solid var(--brand-line);width:100%;max-width:560px}
.resume b{display:block;line-height:1.5}.resume small{color:var(--ink2)}
.resume .btn{margin-inline-start:auto}
.hero-art{position:relative;aspect-ratio:1/.86;max-width:520px;margin-inline:auto;width:100%}
.hero-art .plate{position:absolute;inset:6% 4% 4%;border-radius:36px;background:linear-gradient(160deg,var(--surface),var(--bg2));border:1px solid var(--line);box-shadow:var(--shadow-lg);overflow:hidden}
.hero-art .plate::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 27px,var(--grid) 27px 28px)}
.scale-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.scale-svg .beam{transform-box:view-box;transform-origin:260px 118px;animation:tilt 7s ease-in-out infinite}
.scale-svg .pan{transform-box:view-box}
.scale-svg .pan.l{transform-origin:70px 118px;animation:untilt 7s ease-in-out infinite}
.scale-svg .pan.r{transform-origin:450px 118px;animation:untilt 7s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(4.5deg)}}
@keyframes untilt{0%,100%{transform:rotate(4.5deg)}50%{transform:rotate(-4.5deg)}}
.float{position:absolute;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);font-weight:600;font-size:.92rem;animation:bob 5s ease-in-out infinite}
.float .ic{width:18px;height:18px}
.float.f1{top:6%;inset-inline-end:2%;color:var(--gold)}
.float.f2{bottom:12%;inset-inline-start:-2%;color:var(--ok);animation-delay:-2s}
.float.f3{bottom:3%;inset-inline-end:8%;color:var(--info);animation-delay:-3.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-art{max-width:420px;order:-1}.hero{padding-top:20px}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
.stat{padding:20px 18px;text-align:center}
.stat b{display:block;font-family:var(--font-d);font-size:2.4rem;line-height:1.2;color:var(--brand)}
.stat span{color:var(--ink2);font-size:.95rem}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{padding:26px 24px;display:flex;flex-direction:column;gap:10px;position:relative}
.step .no{font-family:var(--font-d);font-size:2.8rem;line-height:1;color:var(--brand);opacity:.9}
.step h3{font-size:1.2rem;font-weight:600}
.step p{color:var(--ink2);font-size:.98rem}
@media (max-width:820px){.steps{grid-template-columns:1fr}}

/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.bx{padding:24px;display:flex;flex-direction:column;gap:14px;overflow:hidden;position:relative}
.bx h3{font-size:1.18rem;font-weight:600;display:flex;align-items:center;gap:10px}
.bx h3 .ic{color:var(--brand)}
.bx p{color:var(--ink2);font-size:.97rem}
.bx.s4{grid-column:span 4}.bx.s3{grid-column:span 3}.bx.s2{grid-column:span 2}
@media (max-width:900px){.bx.s4,.bx.s3,.bx.s2{grid-column:span 6}.bx.s2.half{grid-column:span 3}}
@media (max-width:560px){.bx.s2.half{grid-column:span 6}}
.mock{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.mock .mo{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface)}
.mock .mo.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.mock .mo.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.mock .mo .ic{width:16px;height:16px}
.mock .ex{margin-top:2px;padding:10px 12px;border-radius:11px;border:1px dashed var(--brand-line);color:var(--ink2);font-size:.88rem}
.mock .ex b{color:var(--brand)}
.mini-ring{width:112px;height:112px;margin:2px auto;position:relative}
.mini-ring svg{width:100%;height:100%}
.mini-ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:1.5rem;font-weight:700}
.rank-mock{display:flex;flex-direction:column;gap:10px}
.rank-mock .bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.rank-mock .bar i{display:block;height:100%;width:68%;background:linear-gradient(90deg,var(--brand),var(--gold-fill));border-radius:99px}
.cert-mock{aspect-ratio:1.414;border-radius:12px;border:2px solid var(--brand);outline:2px solid var(--gold-fill);outline-offset:-8px;display:grid;place-items:center;text-align:center;background:var(--surface);font-family:var(--font-d);color:var(--brand);padding:8px}
.cert-mock small{display:block;font-family:var(--font);color:var(--ink2);font-size:.7rem}

/* faq */
.faq{display:flex;flex-direction:column;gap:10px;max-width:820px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0 20px}
.faq summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ic{transition:transform .25s;color:var(--brand)}
.faq details[open] summary .ic{transform:rotate(180deg)}
.faq details p{padding:0 0 18px;color:var(--ink2);margin-top:-4px}
.foot{margin-top:84px;padding:34px 0 40px;border-top:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:space-between;color:var(--ink2);font-size:.92rem}
.foot .brand-name{font-size:1.3rem;color:var(--ink)}
.foot nav{display:flex;gap:16px;flex-wrap:wrap}
.foot nav a:hover{color:var(--brand)}

/* ---------- page head ---------- */
.page{padding:30px 0 40px}
.page-h{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.page-h h1{font-family:var(--font-d);font-weight:700;font-size:clamp(1.9rem,4.6vw,2.7rem);line-height:1.35}
.page-h p{color:var(--ink2);max-width:62ch}

/* rank card */
.rankcard{display:flex;align-items:center;gap:18px;padding:20px 22px;margin-bottom:26px;flex-wrap:wrap}
.rk-ic{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand-soft),var(--gold-soft));border:1px solid var(--brand-line);color:var(--brand);flex:none}
.rk-ic .ic{width:30px;height:30px}
.rk-info{flex:1;min-width:220px}
.rk-info b{font-family:var(--font-d);font-size:1.4rem;display:block;line-height:1.4}
.rk-info small{color:var(--ink2)}
.xpbar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--gold-fill));transition:width 1s var(--ease)}

/* timeline map */
.timeline{list-style:none;margin:0;padding:0;position:relative;display:flex;flex-direction:column;gap:18px}
.timeline::before{content:"";position:absolute;inset-block:34px;inset-inline-start:27px;border-inline-start:3px double var(--line2)}
.node{display:grid;grid-template-columns:56px 1fr;gap:16px;position:relative;--lv:#10B981}
.node-dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2.5px solid var(--lv);color:var(--lv);z-index:1;box-shadow:0 0 0 6px var(--bg)}
.node.done .node-dot{background:var(--lv);color:#fff}
html[data-theme="dark"] .node.done .node-dot{color:#04211A}
.node.next .node-dot{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 6px var(--bg),0 0 0 6px color-mix(in srgb,var(--lv) 50%,transparent)}100%{box-shadow:0 0 0 6px var(--bg),0 0 0 22px transparent}}
.node-card{padding:20px 22px;display:flex;flex-direction:column;gap:10px;transition:transform .25s var(--ease),border-color .2s}
.node-card:hover{transform:translateY(-3px);border-color:var(--lv)}
.node-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.node-no{font-size:.86rem;font-weight:600;color:var(--lv);filter:saturate(1.1) brightness(.85)}
html[data-theme="dark"] .node-no{filter:none}

.bdg.on{opacity:1;filter:none;background:linear-gradient(160deg,var(--gold-soft),var(--surface));border-color:color-mix(in srgb,var(--gold-fill) 50%,transparent)}
.bdg .bi{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--ink3)}
.bdg.on .bi{background:linear-gradient(135deg,var(--gold-fill),#FFDB8A);color:#4A3200;box-shadow:0 6px 16px var(--gold-soft)}
.bdg b{font-size:.95rem;line-height:1.4}
.bdg small{color:var(--ink2);line-height:1.5;font-size:.8rem}
.links{display:flex;gap:10px;flex-wrap:wrap}

/* final */
.final-hero{padding:34px 26px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:18px;position:relative;overflow:hidden}
.final-hero h1{font-family:var(--font-d);font-size:clamp(1.8rem,4.6vw,2.7rem);line-height:1.4}
.grade{display:inline-flex;align-items:center;gap:8px;padding:6px 18px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:700}
.bd-row{display:grid;grid-template-columns:30px 1fr 52px;gap:12px;align-items:center;padding:8px 0}
.bd-row .n{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;background:color-mix(in srgb,var(--lv) 18%,transparent);color:var(--ink)}
.bd-row .bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bd-row .bar i{display:block;height:100%;border-radius:99px;background:var(--lv);transition:width 1s var(--ease)}
.bd-row em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
.bd-row small{display:block;color:var(--ink2);line-height:1.4;font-size:.84rem}
.cert-name{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.cert-name .field{flex:1;min-width:200px}
.pv{width:100%;border-radius:16px;border:1px solid var(--line);display:block;box-shadow:var(--shadow)}
.lockbox{padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.lockbox .ic{width:48px;height:48px;color:var(--gold)}
.lockbox ul{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .scale-svg .beam,.scale-svg .pan{animation:none!important}
  .reveal{opacity:1!important;transform:none!important}
}

<script>const DATA = {"levels":[{"n":"أساسيات قائمة الدخل","d":"الإيرادات والمصروفات ومجمل الربح وصافيه، وكيف تُبنى قائمة الدخل خطوة بخطوة.","ic":"bars","df":1,"h":"#10B981"},{"n":"المسائل والقيود التطبيقية","d":"حسابات الأرباح وقيود اليومية الأساسية: من الأرقام إلى القيد الصحيح.","ic":"calc","df":2,"h":"#14B8A6"},{"n":"الدخل الشامل وحقوق الملكية","d":"بنود الدخل الشامل الآخر وأثر الإيرادات والمصروفات على حقوق الملكية.","ic":"layers","df":2,"h":"#38A3F5"},{"n":"المصطلحات والمعايير الدولية","d":"الأصول والخصوم والإهلاك والاضمحلال، مع معياري IFRS 15 وIFRS 13.","ic":"book","df":1,"h":"#6C7CFF"},{"n":"الدورات المستندية والمخازن","d":"مستندات المشتريات والمبيعات والمخازن والخزينة والرواتب وترتيبها.","ic":"doc","df":2,"h":"#A66BFF"},{"n":"أساسيات الدورة المحاسبية","d":"القيد المزدوج وطبيعة الحسابات والدفاتر وخطوات الدورة المحاسبية.","ic":"cycle","df":1,"h":"#F5A524"},{"n":"التسويات وميزان المراجعة والإقفال","d":"الاستحقاق والتسويات والإقفال وأخطاء لا يكشفها ميزان المراجعة.","ic":"list","df":3,"h":"#FF7A59"},{"n":"المقارنات وإكمال العبارات","d":"التحليل المالي والفروق الدقيقة بين المفاهيم المتشابهة.","ic":"scale","df":3,"h":"#F0587F"}],"qs":[{"id":1,"lv":1,"q":"ما هو التعريف المحاسبي لـ \"قائمة الدخل\"؟","a":"تقرير مالي يوضح الإيرادات والمصروفات لفترة زمنية معينة، ويظهر نتيجة الأعمال من ربح أو خسارة.","o":["تقرير مالي يوضح الإيرادات والمصروفات لفترة زمنية ويُظهر الربح أو الخسارة","تقرير مالي يوضح الأصول والخصوم وحقوق الملكية في تاريخ محدد ويُظهر المركز المالي","تقرير مالي يوضح التدفقات النقدية الداخلة والخارجة لفترة زمنية ويُظهر صافي التغير في النقدية","تقرير مالي يوضح التغيرات في رأس المال والأرباح المحتجزة لفترة زمنية ويُظهر رصيد حقوق الملكية"]},{"id":2,"lv":1,"q":"ما الهدف الرئيسي من إعداد قائمة الدخل؟","a":"تقديم معلومات عن الأداء المالي للشركة خلال فترة محددة لتحديد الربحية والكفاءة التشغيلية.","o":["تقديم معلومات عن الأداء المالي خلال فترة محددة لتحديد الربحية والكفاءة التشغيلية","تقديم معلومات عن المركز المالي في تاريخ محدد لتحديد السيولة وقدرة الشركة على السداد","تقديم معلومات عن مصادر النقد واستخداماته خلال فترة محددة لتقييم السيولة التشغيلية","تقديم معلومات عن التغيرات في حقوق الملكية خلال فترة محددة لتحديد حصة كل مساهم"]},{"id":3,"lv":1,"q":"ما الفرق بين الإيرادات والمصروفات في قائمة الدخل؟","a":"الإيرادات هي المنافع الاقتصادية أو التدفقات النقدية الداخلة المتحققة، بينما المصروفات هي التدفقات الخارجة أو التكاليف المترتبة لتحقيق الإيرادات.","o":["الإيرادات منافع أو تدفقات داخلة متحققة، والمصروفات تدفقات خارجة أو تكاليف مترتبة لتحقيق الإيرادات","الإيرادات تقتصر على النقد المحصَّل فعلاً، والمصروفات تقتصر على النقد المدفوع فعلاً خلال الفترة","الإيرادات منافع داخلة ناتجة عن الاقتراض وزيادة رأس المال، والمصروفات تدفقات خارجة لسداد القروض وتوزيع الأرباح","الإيرادات تُثبت عند التحصيل النقدي، أما المصروفات فتُثبت عند حدوث الالتزام بدفعها"]},{"id":4,"lv":1,"q":"كيف يُحسب \"مجمل الربح\" في قائمة الدخل؟","a":"ينشأ من طرح تكلفة البضاعة المباعة من إجمالي الإيرادات (المبيعات).","o":["بطرح تكلفة البضاعة المباعة من إجمالي الإيرادات (المبيعات)","بطرح المصاريف التشغيلية من إجمالي الإيرادات (المبيعات)","بطرح تكلفة البضاعة المباعة والمصاريف التشغيلية من إجمالي الإيرادات (المبيعات)","بطرح المصروفات الأخرى والضرائب من إجمالي الإيرادات (المبيعات)"]},{"id":5,"lv":1,"q":"صياغة رياضية: ما هي معادلة حساب مجمل الربح؟","a":"مجمل الربح = الإيرادات (المبيعات) − تكلفة البضاعة المباعة","o":["مجمل الربح = الإيرادات (المبيعات) − تكلفة البضاعة المباعة","مجمل الربح = الإيرادات (المبيعات) − المصروفات التشغيلية","مجمل الربح = الإيرادات (المبيعات) − تكلفة البضاعة المباعة − المصروفات التشغيلية","مجمل الربح = الإيرادات (المبيعات) + المصروفات الأخرى − تكلفة البضاعة المباعة"],"n":"ببساطة: مجمل الربح هو ما يتبقى من المبيعات بعد تغطية تكلفة ما بِيع من بضاعة."},{"id":6,"lv":1,"q":"ما المقصود بـ \"المصاريف التشغيلية\"؟","a":"التكاليف المرتبطة مباشرة بتشغيل النشاط الأساسي للشركة، مثل المصاريف الإدارية والعمومية والتسويقية والرواتب والإيجارات.","o":["تكاليف ترتبط بتشغيل النشاط الأساسي كالرواتب والإيجارات والمصاريف الإدارية والتسويقية","تكاليف ترتبط بتمويل النشاط الأساسي كالفوائد على القروض ورسوم البنوك والعمولات","تكاليف ترتبط بإنتاج السلع المباعة كالمواد الخام والأجور المباشرة والمصاريف الصناعية","تكاليف ترتبط بالأنشطة غير المتكررة كخسائر بيع الأصول والغرامات والتعويضات"]},{"id":7,"lv":1,"q":"كيف يُحسب \"الربح التشغيلي\"؟","a":"بطرح المصاريف التشغيلية من مجمل الربح.","o":["بطرح المصاريف التشغيلية من مجمل الربح","بطرح تكلفة البضاعة المباعة من مجمل الربح","بطرح المصروفات الأخرى والضرائب من مجمل الربح","بطرح المصاريف التشغيلية من إجمالي الإيرادات مباشرة"]},{"id":8,"lv":1,"q":"ما الذي تمثله \"الإيرادات والمصروفات الأخرى\" في قائمة الدخل؟","a":"البنود الناتجة عن أنشطة غير مرتبطة بالنشاط الأساسي للشركة، مثل الفوائد المدفوعة/المكتسبة وأرباح أو خسائر بيع الأصول.","o":["بنود ناتجة عن أنشطة غير مرتبطة بالنشاط الأساسي، كالفوائد وأرباح أو خسائر بيع الأصول","بنود ناتجة عن النشاط الأساسي لكنها غير متكررة، كالمبيعات الموسمية والخصومات التجارية","بنود ناتجة عن معاملات مع المالكين، كتوزيعات الأرباح وإصدار الأسهم","بنود ناتجة عن إعادة تقييم الأصول، كمكاسب إعادة التقييم وفروق العملات"]},{"id":9,"lv":1,"q":"ما هي المعادلة الشاملة لحساب \"صافي الربح\"؟","a":"صافي الربح = الإيرادات − المصروفات التشغيلية − المصروفات الأخرى ± أرباح أو خسائر العمليات غير المستمرة","o":["الإيرادات − المصروفات التشغيلية − المصروفات الأخرى ± أرباح أو خسائر العمليات غير المستمرة","الإيرادات − المصروفات التشغيلية + المصروفات الأخرى ± أرباح أو خسائر العمليات غير المستمرة","الإيرادات − المصروفات التشغيلية − المصروفات الأخرى ± بنود الدخل الشامل الآخر","الإيرادات − المصروفات التشغيلية ± أرباح أو خسائر العمليات غير المستمرة"]},{"id":10,"lv":1,"q":"ما الفرق بين صافي الربح قبل الضريبة وصافي الربح بعد الضريبة؟","a":"صافي الربح قبل الضريبة هو الربح المتبقي قبل اقتطاع ضريبة الدخل، بينما صافي الربح بعد الضريبة هو الناتج النهائي بعد خصم الضرائب المستحقة.","o":["الأول هو الربح قبل اقتطاع ضريبة الدخل، والثاني هو الناتج النهائي بعد خصم الضرائب المستحقة","الأول هو الربح بعد خصم الفوائد والضرائب معاً، والثاني هو الربح بعد خصم الفوائد وحدها","الأول هو الربح قبل خصم تكلفة البضاعة المباعة، والثاني هو الربح بعد خصمها","الأول هو الربح قبل توزيع الأرباح على المساهمين، والثاني هو الربح بعد توزيعها"]},{"id":11,"lv":1,"q":"كيف تختلف قائمة الدخل عن قائمة التدفقات النقدية من حيث الأساس المحاسبي؟","a":"تعتمد قائمة الدخل على أساس الاستحقاق، بينما تعتمد قائمة التدفقات النقدية على الأساس النقدي الفعلي.","o":["قائمة الدخل بأساس الاستحقاق، وقائمة التدفقات النقدية بالأساس النقدي الفعلي","قائمة الدخل بالأساس النقدي الفعلي، وقائمة التدفقات النقدية بأساس الاستحقاق","كلتاهما تعتمد على أساس الاستحقاق، ويقتصر الاختلاف على طريقة التبويب والعرض","كلتاهما تعتمد على الأساس النقدي الفعلي، ويقتصر الاختلاف على طريقة التبويب والعرض"]},{"id":12,"lv":2,"q":"إذا بلغت إيرادات شركة 500,000 ريال، والمصروفات التشغيلية 300,000 ريال، وتكاليف التمويل 20,000 ريال، فما صافي الربح قبل الضريبة؟","a":"180,000 ريال (الناتج من: 500,000 − 300,000 − 20,000).","o":["180,000 ريال","200,000 ريال","220,000 ريال","480,000 ريال"]},{"id":13,"lv":2,"q":"إذا حققت شركة مبيعات بمبلغ 1,000,000 ريال وكانت تكلفة البضاعة المباعة 600,000 ريال، فكم يبلغ مجمل الربح؟","a":"400,000 ريال (الناتج من: 1,000,000 − 600,000).","o":["400,000 ريال","600,000 ريال","1,000,000 ريال","1,600,000 ريال"]},{"id":14,"lv":2,"q":"بلغت إيرادات مبيعات شركة 800,000 ريال، ومصروفات التشغيل 350,000 ريال، وتكلفة البضاعة المباعة 250,000 ريال، فما هو الربح التشغيلي؟","a":"200,000 ريال (الناتج من: 800,000 − 250,000 − 350,000).","o":["200,000 ريال","450,000 ريال","550,000 ريال","1,400,000 ريال"]},{"id":15,"lv":2,"q":"شركة لديه إيرادات مبيعات 900,000 ريال، وتكلفة بضاعة مباعة 500,000 ريال، ومصاريف إدارية وتسويقية 200,000 ريال، ومكاسب غير مستمرة من بيع معدات 50,000 ريال، فما هو الربح التشغيلي؟","a":"200,000 ريال، حيث تُستبعد المكاسب غير المستمرة من بيع المعدات عند حساب الربح التشغيلي.","o":["200,000 ريال","250,000 ريال","400,000 ريال","150,000 ريال"]},{"id":16,"lv":3,"q":"ما المقصود بـ \"قائمة الدخل الشامل\"؟","a":"قائمة تعرض الأداء المالي شاملاً صافي الربح بالإضافة إلى المكاسب أو الخسائر غير المحققة التي لا تدرج في قائمة الدخل العادية.","o":["قائمة تعرض صافي الربح بالإضافة إلى المكاسب أو الخسائر غير المحققة التي لا تدرج في قائمة الدخل العادية","قائمة تعرض صافي الربح بعد استبعاد المكاسب والخسائر غير المتكررة الناتجة عن الأنشطة التشغيلية","قائمة تعرض صافي الربح بالإضافة إلى توزيعات الأرباح والتغيرات في رأس المال المدفوع خلال الفترة","قائمة تعرض صافي الربح بالإضافة إلى التدفقات النقدية من الأنشطة الاستثمارية والتمويلية خلال الفترة"]},{"id":17,"lv":3,"q":"ما هو المفهوم المحاسبي لـ \"الدخل الشامل الآخر\" (OCI)؟","a":"بنود تتضمن التغيرات في حقوق الملكية خلال الفترة ولا تظهر في قائمة الدخل العادية لأنها لم تتحقق بعد.","o":["بنود تتضمن تغيرات في حقوق الملكية خلال الفترة ولا تظهر في قائمة الدخل العادية لأنها لم تتحقق بعد","بنود تتضمن تغيرات في حقوق الملكية ناتجة عن معاملات مع المالكين مثل إصدار الأسهم","بنود تتضمن إيرادات محققة نقداً لكنها لا تظهر في قائمة الدخل لعدم ارتباطها بالنشاط الأساسي","بنود تتضمن مصروفات مدفوعة مقدماً لفترات قادمة ولا تظهر في قائمة الدخل لأنها لم تستحق بعد"]},{"id":18,"lv":3,"q":"أذكر ثلاثة أمثلة لبنود تُدرج ضمن \"الدخل الشامل الآخر\".","a":"التغيرات في القيمة العادلة للأدوات المالية، فروق ترجمة العملات الأجنبية، وأرباح/خسائر إعادة تقييم الممتلكات والمعدات.","o":["تغيرات القيمة العادلة للأدوات المالية، وفروق ترجمة العملات الأجنبية، وإعادة تقييم الممتلكات والمعدات","تغيرات القيمة العادلة للأدوات المالية، وفروق ترجمة العملات الأجنبية، وخسائر بيع الممتلكات والمعدات","فروق ترجمة العملات الأجنبية، وإعادة تقييم الممتلكات والمعدات، وتوزيعات الأرباح النقدية","تغيرات القيمة العادلة للأدوات المالية، وإعادة تقييم الممتلكات والمعدات، ومصروف الإهلاك"]},{"id":19,"lv":3,"q":"لماذا يتم فصل بنود الدخل الشامل الآخر عن صافي الربح في التقارير المالية؟","a":"للتمييز بين الأداء التشغيلي الرئيسي المحقق والبنود غير المحققة أو المؤقتة التي قد تقلب الأداء بدون تدفق نقدي فعلي.","o":["للتمييز بين الأداء التشغيلي المحقق والبنود غير المحققة التي قد تقلّب الأداء دون تدفق نقدي فعلي","لأن هذه البنود تمثل تدفقات نقدية مستقبلية مؤكدة يجب فصلها عن أرباح الفترة الحالية للمساهمين","لتخفيض الضريبة المستحقة على الشركة بإخراج جزء من الدخل من صافي الربح الخاضع للضريبة","لأن هذه البنود ناتجة عن أخطاء محاسبية في الفترات السابقة تحتاج إلى تصحيح قبل احتسابها في الأرباح"]},{"id":20,"lv":3,"q":"أين يُعرض الدخل الشامل الآخر في قائمة الدخل الشامل؟","a":"يُعرض في الجزء السفلي من القائمة بشكل منفصل مباشرة بعد عرض صافي الربح.","o":["في الجزء السفلي من القائمة بشكل منفصل، مباشرة بعد عرض صافي الربح","ضمن بنود الإيرادات والمصروفات الأخرى قبل الوصول إلى صافي الربح","في الجزء العلوي من القائمة قبل عرض الإيرادات وتكلفة المبيعات","في إيضاحات القوائم المالية بعيداً عن قائمة الدخل الشامل"]},{"id":21,"lv":3,"q":"هل يؤثر الدخل الشامل الآخر عادةً على الأرباح القابلة للتوزيع على المساهمين؟ ولماذا؟","a":"لا، لأنه يتكون من أرباح أو خسائر غير محققة لا تمثل تدفقات نقدية فعلية قابلة للتوزيع.","o":["لا، لأنه يتكون من أرباح أو خسائر غير محققة لا تمثل تدفقات نقدية قابلة للتوزيع","نعم، لأنه يزيد حقوق الملكية وبالتالي يزيد المبلغ المتاح للتوزيع على المساهمين","نعم، لأنه جزء من الدخل الشامل الذي يحق للمساهمين الحصول عليه كاملاً","لا، لأن توزيعات الأرباح تُحسب من أرباح الفترة الحالية دون أي أرصدة محتجزة من سنوات سابقة"]},{"id":22,"lv":3,"q":"ما الفرق بين الدخل الشامل الآخر والتغيرات المباشرة في حقوق الملكية؟","a":"الدخل الشامل الآخر يعكس مكاسب/خسائر غير محققة من تقييم الأصول والالتزامات، بينما التغيرات المباشرة تشمل معاملات مع المالكين كإصدار الأسهم وتوزيعات الأرباح.","o":["الآخر يعكس مكاسب أو خسائر غير محققة من تقييم الأصول والالتزامات، والتغيرات المباشرة تشمل معاملات المالكين كإصدار الأسهم والتوزيعات","الآخر يشمل معاملات المالكين كإصدار الأسهم والتوزيعات، والتغيرات المباشرة تعكس مكاسب أو خسائر غير محققة من تقييم الأصول والالتزامات","الآخر يشمل الأرباح المحققة نقداً من الأنشطة الاستثمارية للشركة، والتغيرات المباشرة تشمل توزيعات الأرباح المعلنة","الآخر يظهر ضمن قائمة الدخل العادية بعد صافي الربح، والتغيرات المباشرة تظهر ضمن قائمة التدفقات النقدية"]},{"id":23,"lv":2,"q":"إذا حققت شركة صافي ربح قدره 300,000 ريال، وأرباح تقييم أصول مالية متاحة للبيع قدرها 50,000 ريال، فما هو إجمالي الدخل الشامل؟","a":"350,000 ريال (300,000 + 50,000).","o":["350,000 ريال","300,000 ريال","250,000 ريال","400,000 ريال"]},{"id":24,"lv":2,"q":"شركة حققت صافي ربح 100,000 ريال، وتكبدت خسائر تحويل عملة أجنبية 10,000 ريال، ومكاسب إعادة تقييم أصول ثابتة 20,000 ريال، فما إجمالي الدخل الشامل؟","a":"110,000 ريال (100,000 − 10,000 + 20,000).","o":["110,000 ريال","130,000 ريال","90,000 ريال","70,000 ريال"]},{"id":25,"lv":2,"q":"بلغت أرباح شركة صافية 500,000 ريال، وخسرت 50,000 ريال في القيمة العادلة للأدوات المالية، وسجلت 30,000 ريال كربح تسوية معاشات التقاعد، فما إجمالي الدخل الشامل؟","a":"480,000 ريال (500,000 − 50,000 + 30,000).","o":["480,000 ريال","420,000 ريال","450,000 ريال","580,000 ريال"]},{"id":26,"lv":4,"q":"المصطلح المالي: الأصول (Assets)","a":"موارد تملكها المنشأة نتيجة أحداث سابقة، وتتوقع الحصول منها على منافع اقتصادية مستقبلية.","o":["موارد تملكها المنشأة نتيجة أحداث سابقة وتتوقع منها منافع اقتصادية مستقبلية","موارد يملكها الملاك شخصياً نتيجة أحداث سابقة ويتوقعون منها منافع اقتصادية مستقبلية","التزامات تتحملها المنشأة نتيجة أحداث سابقة وتتوقع منها منافع اقتصادية مستقبلية","موارد تتوقع المنشأة الحصول عليها نتيجة أحداث مستقبلية محتملة وتحقق منافع اقتصادية مستقبلية"]},{"id":27,"lv":4,"q":"المصطلح المالي: الخصوم (Liabilities)","a":"التزامات حالية على المنشأة ناشئة عن أحداث ماضية، يتطلب تسويتها تدفق موارد اقتصادية لخارج الشركة.","o":["التزامات حالية على المنشأة ناشئة عن أحداث ماضية، يتطلب تسويتها تدفق موارد اقتصادية للخارج","التزامات محتملة على المنشأة ناشئة عن أحداث مستقبلية، يتطلب تسويتها تدفق موارد اقتصادية للخارج","التزامات حالية على المنشأة ناشئة عن أحداث ماضية، يتطلب تسويتها تدفق منافع اقتصادية للداخل","حقوق للمنشأة لدى الغير ناشئة عن أحداث ماضية، يتطلب تحصيلها تدفق موارد اقتصادية للداخل"]},{"id":28,"lv":4,"q":"المصطلح المالي: حقوق الملكية (Equity)","a":"الحقوق المتبقية في أصول المنشأة بعد خصم جميع خصومها، وتتكون من رأس المال، الاحتياطيات، والأرباح المحتجزة.","o":["الحقوق المتبقية في أصول المنشأة بعد خصم جميع خصومها، وتتكون من رأس المال والاحتياطيات والأرباح المحتجزة","الحقوق المتبقية في أصول المنشأة بعد خصم الخصوم المتداولة، وتتكون من رأس المال والاحتياطيات والأرباح المحتجزة","إجمالي أصول المنشأة مضافاً إليه جميع خصومها، ويتكون من رأس المال والقروض والأرباح المحتجزة","الحقوق المتبقية في أصول المنشأة بعد خصم جميع خصومها، وتتكون من رأس المال والقروض طويلة الأجل"]},{"id":29,"lv":4,"q":"المصطلح المالي: الإيرادات (Revenues)","a":"التدفقات النقدية أو المنافع الاقتصادية الداخلة للمنشأة خلال الفترة الناتجة عن أنشطتها الرئيسية.","o":["تدفقات أو منافع اقتصادية داخلة للمنشأة خلال الفترة ناتجة عن أنشطتها الرئيسية","تدفقات نقدية داخلة للمنشأة خلال الفترة ناتجة عن الاقتراض وزيادة رأس المال","تدفقات أو منافع اقتصادية داخلة للمنشأة عند بيع أصل ثابت بسعر يفوق قيمته الدفترية","منافع اقتصادية يُتوقع أن تحصل عليها المنشأة في فترات مستقبلية من أنشطتها الرئيسية"]},{"id":30,"lv":4,"q":"المصطلح المالي: المصروفات (Expenses)","a":"التدفقات الخارجة أو نقص منافع الأصول خلال الفترة الناتجة عن الأنشطة التشغيلية للمنشأة.","o":["تدفقات خارجة أو نقص في منافع الأصول خلال الفترة ناتجة عن الأنشطة التشغيلية","تدفقات خارجة ناتجة عن شراء أصول ثابتة طويلة الأجل خلال الفترة المحاسبية","تدفقات خارجة لسداد أصل القروض وتوزيع الأرباح على المساهمين خلال الفترة","التزامات مستقبلية محتملة ناتجة عن الأنشطة التشغيلية وتخص فترات قادمة"]},{"id":31,"lv":4,"q":"المصطلح المالي: الأرباح المحتجزة (Retained Earnings)","a":"جزء من صافي الأرباح المتحققة لم يتم توزيعه على المساهمين، وتم الاحتفاظ به لإعادة الاستثمار في الشركة.","o":["جزء من صافي الأرباح المتحققة لم يُوزَّع على المساهمين واحتُفظ به لإعادة الاستثمار","جزء من الأرباح غير المحققة الناتجة عن إعادة التقييم احتُفظ به ضمن حقوق الملكية","جزء من صافي الأرباح المتحققة وُزِّع على المساهمين نقداً خلال الفترة نفسها","مبالغ ساهم بها الملاك عند التأسيس ولم تُوزَّع واحتُفظ بها لإعادة الاستثمار"]},{"id":32,"lv":4,"q":"المصطلح المالي: الإهلاك (Depreciation)","a":"العملية المحاسبية لتوزيع تكلفة الأصل الثابت على مدار عمره الإنتاجي المتوقع.","o":["توزيع تكلفة الأصل الثابت على عمره الإنتاجي المتوقع","تخفيض قيمة الأصل الثابت إلى قيمته القابلة للاسترداد عند انخفاضها","إعادة قياس قيمة الأصل الثابت بالقيمة العادلة في نهاية كل فترة","تحويل تكلفة الأصل الثابت إلى مصروف بالكامل في فترة الشراء"]},{"id":33,"lv":4,"q":"المصطلح المالي: الإضمحلال (Impairment)","a":"مقدار الانخفاض في قيمة الأصل عندما تتجاوز قيمته الدفترية قيمته القابلة للاسترداد.","o":["مقدار الانخفاض في قيمة الأصل عندما تتجاوز قيمته الدفترية قيمته القابلة للاسترداد","توزيع تكلفة الأصل على عمره الإنتاجي المتوقع بطريقة القسط الثابت أو المتناقص","مقدار الانخفاض في قيمة الأصل عندما تتجاوز قيمته القابلة للاسترداد قيمته الدفترية","مقدار الانخفاض في قيمة الأصل نتيجة بيعه بسعر أقل من تكلفته الأصلية في السوق"]},{"id":34,"lv":4,"q":"ما المبدأ الأساسي للاعتراف بالإيراد وفق معيار التقارير المالية الدولي IFRS 15؟","a":"يتم الاعتراف بالإيراد عند الوفاء بالتزامات الأداء ونقل السيطرة على السلعة أو الخدمة إلى العميل.","o":["الاعتراف بالإيراد عند الوفاء بالتزامات الأداء ونقل السيطرة على السلعة أو الخدمة للعميل","الاعتراف بالإيراد عند استلام المقابل النقدي من العميل بغض النظر عن موعد التسليم","الاعتراف بالإيراد عند توقيع العقد مع العميل بغض النظر عن موعد التسليم","الاعتراف بالإيراد عند نقل معظم المخاطر والمنافع القانونية لملكية السلعة إلى العميل"],"r":"IFRS 15: الاعتراف بالإيراد من العقود مع العملاء"},{"id":35,"lv":4,"q":"ما هو تعريف القياس بالقيمة العادلة وفق معيار IFRS 13؟","a":"السعر الذي يتم استلامه لبيع أصل أو دفعه لنقل التزام في معاملة منظمة بين مشاركين في السوق في تاريخ القياس.","o":["السعر المستلم لبيع أصل أو المدفوع لنقل التزام في معاملة منظمة بين مشاركين في السوق في تاريخ القياس","السعر الذي دُفع فعلاً لشراء الأصل أو استُلم عند تحمل الالتزام في تاريخ العملية الأصلية","السعر الذي تحصل عليه المنشأة من بيع الأصل في معاملة تصفية جبرية بين أطراف ذات علاقة","القيمة الحالية للتدفقات النقدية المستقبلية التي تحددها الإدارة وفق توقعاتها الخاصة بالأصل"],"r":"IFRS 13: قياس القيمة العادلة"},{"id":36,"lv":5,"q":"ما المستند الذي يبدأ به العمل في \"دورة المشتريات\" عند وصول الصنف لحد إعادة الطلب؟","a":"طلب الشراء (Purchase Requisition).","o":["طلب الشراء (Purchase Requisition)","أمر الشراء (Purchase Order)","عرض الأسعار من المورد (Quotation)","إذن الفحص والاستلام (Receiving Report)"],"n":"يصدر طلب الشراء عند وصول رصيد الصنف إلى حد إعادة الطلب، ثم تتوالى بقية مستندات دورة المشتريات."},{"id":37,"lv":5,"q":"ما التسلسل الصحيح للمستندات في \"دورة المشتريات\"؟","a":"طلب شراء ← عرض أسعار ← أمر توريد/شراء ← إذن فحص واستلام ← فاتورة المورد.","o":["طلب شراء ← عرض أسعار ← أمر توريد/شراء ← إذن فحص واستلام ← فاتورة المورد","طلب شراء ← عرض أسعار ← أمر توريد/شراء ← فاتورة المورد ← إذن فحص واستلام","طلب شراء ← أمر توريد/شراء ← عرض أسعار ← إذن فحص واستلام ← فاتورة المورد","عرض أسعار ← طلب شراء ← أمر توريد/شراء ← إذن فحص واستلام ← فاتورة المورد"]},{"id":38,"lv":5,"q":"ما هو المستند الذي يحرره المورد لإثبات التزامات المدينية ومستحقات المورد على الشركة؟","a":"فاتورة المورد (Vendor Invoice).","o":["فاتورة المورد (Vendor Invoice)","أمر التوريد/الشراء (Purchase Order)","عرض الأسعار (Quotation)","إذن الفحص والاستلام"],"n":"تثبت الفاتورة مستحقات المورد على الشركة، وهي آخر مستند في تسلسل دورة المشتريات."},{"id":39,"lv":5,"q":"ما المستند الداخلي المعتمد للتأكيد على تجهيز طلبية البيع للعميل في \"دورة المبيعات\"؟","a":"أمر البيع (Sales Order - SO).","o":["أمر البيع (Sales Order - SO)","عرض السعر (Quotation)","إذن الصرف/التسليم (Delivery Note)","فاتورة المبيعات (Sales Invoice)"],"n":"أمر البيع مستند داخلي يأتي بعد عرض السعر وقبل إذن الصرف في دورة المبيعات."},{"id":40,"lv":5,"q":"ما هو التسلسل المستندي الكامل لـ \"دورة المبيعات\"؟","a":"طلب العميل ← عرض السعر ← أمر بيع ← إذن صرف/تسليم بضاعة ← فاتورة المبيعات.","o":["طلب العميل ← عرض السعر ← أمر بيع ← إذن صرف/تسليم بضاعة ← فاتورة المبيعات","طلب العميل ← عرض السعر ← أمر بيع ← فاتورة المبيعات ← إذن صرف/تسليم بضاعة","طلب العميل ← أمر بيع ← عرض السعر ← إذن صرف/تسليم بضاعة ← فاتورة المبيعات","عرض السعر ← طلب العميل ← أمر بيع ← إذن صرف/تسليم بضاعة ← فاتورة المبيعات"]},{"id":41,"lv":5,"q":"ما المستند المستخدم في المخازن لإثبات دخول البضائع والمنتجات الجديدة؟","a":"إذن إضافة مخزني (Goods Receipt).","o":["إذن إضافة مخزني (Goods Receipt)","إذن صرف مخزني (Goods Issue)","إذن تحويل بين المخازن (Stock Transfer)","كشف جرد المخزون (Stock Count Sheet)"],"n":"يُستخدم عند دخول بضائع أو منتجات جديدة إلى المخزن، ويقابله إذن الصرف عند خروجها."},{"id":42,"lv":5,"q":"ما المستند المستخدم في المخازن عند نقل البضائع بين الفروع أو مخازن الشركة المختلفة؟","a":"إذن تحويل بين المخازن (Stock Transfer).","o":["إذن تحويل بين المخازن (Stock Transfer)","إذن إضافة مخزني (Goods Receipt)","إذن صرف مخزني (Goods Issue)","كشف جرد المخزون (Stock Count Sheet)"],"n":"يوثّق نقل البضائع بين الفروع أو بين مخازن الشركة المختلفة."},{"id":43,"lv":5,"q":"ما الدفتر أو المستند التفصيلي الذي يسجل الحركة المباشرة للصنف (وارد، صادر، رصيد متبقٍ)؟","a":"كارت الصنف.","o":["كارت الصنف (Stock Card)","دفتر اليومية العامة","إذن الإضافة المخزني","سجل الأصول الثابتة"],"n":"يُسجَّل فيه الوارد والصادر والرصيد المتبقي لكل صنف على حدة."},{"id":44,"lv":5,"q":"ما المستند الذي يُصدره قسم الخزينة لإثبات تحصيل المبالغ النقدية أو الشيكات من العملاء؟","a":"إيصال استلام نقدية/شيكات (قبض).","o":["إيصال استلام نقدية/شيكات (قبض)","إيصال صرف نقدية/شيكات (دفع)","فاتورة المبيعات للعميل (Sales Invoice)","كشف حساب البنك الشهري (Bank Statement)"],"n":"يصدره قسم الخزينة عند تحصيل نقدية أو شيكات من العملاء."},{"id":45,"lv":7,"q":"ما الغرض من إعداد \"مذكرة تسوية البنك\"؟","a":"مطابقة رصيد حساب البنك الدفتري مع رصيد كشف الحساب الوارد من البنك ومعالجة الفروقات.","o":["مطابقة رصيد البنك الدفتري مع رصيد كشف الحساب الوارد من البنك ومعالجة الفروقات","مطابقة رصيد الخزينة الدفتري مع الجرد الفعلي للنقدية بالصندوق ومعالجة الفروقات","مطابقة رصيد حساب العملاء مع كشوف الحسابات المرسلة إليهم ومعالجة الفروقات","مطابقة إجمالي الأرصدة المدينة مع إجمالي الأرصدة الدائنة في ميزان المراجعة ومعالجة الفروقات"]},{"id":46,"lv":5,"q":"ما هو ترتيب تسلسل المستندات في \"دورة الأجور والعاملين\"؟","a":"سجل الحضور والانصراف ← إذن غياب/إجازة ← سجل السلف والاستقطاعات ← كشف الرواتب.","o":["سجل الحضور والانصراف ← إذن غياب/إجازة ← سجل السلف والاستقطاعات ← كشف الرواتب","إذن غياب/إجازة ← سجل الحضور والانصراف ← سجل السلف والاستقطاعات ← كشف الرواتب","سجل الحضور والانصراف ← سجل السلف والاستقطاعات ← إذن غياب/إجازة ← كشف الرواتب","سجل الحضور والانصراف ← إذن غياب/إجازة ← كشف الرواتب ← سجل السلف والاستقطاعات"]},{"id":47,"lv":6,"q":"ما هي المحاسبة المالية وفق تعريفها الجوهري؟","a":"لغة الأعمال والعلم الذي يختص بقياس وتجميع وتصنيف وتلخيص وعرض المعاملات المالية لإيصال المعلومات لاتخاذ القرارات.","o":["علم يقيس ويصنف ويلخص ويعرض المعاملات المالية لإيصال المعلومات إلى متخذي القرارات","علم يحدد تكلفة المنتجات ويحللها لمساعدة الإدارة الداخلية في التسعير والرقابة","علم يفحص القوائم المالية بشكل مستقل لإبداء رأي فني محايد عن عدالتها","علم يعد التقارير المالية لحساب الوعاء الضريبي وتحديد الضرائب المستحقة"]},{"id":48,"lv":6,"q":"ما هي القاعدة المحاسبية لنظام \"القيد المزدوج\" (Double-entry System)؟","a":"لكل عملية مالية طرفان متساويان في القيمة، أحدهما مدين (يأخذ) والآخر دائن (يعطي).","o":["لكل عملية مالية طرفان متساويان في القيمة، أحدهما مدين (يأخذ) والآخر دائن (يعطي)","لكل عملية مالية طرفان مختلفان في القيمة، ويُرحَّل الفرق إلى حساب الأرباح والخسائر","لكل عملية مالية طرفان متساويان في القيمة، أحدهما أصل والآخر مصروف","لكل عملية مالية طرفان متساويان في القيمة، أحدهما نقدي والآخر آجل"]},{"id":49,"lv":6,"q":"بحسب طبيعة الحسابات، ما هي الحسابات التي تُعد مدينة دائماً عند الزيادة؟","a":"الأصول والمصروفات والمسحوبات الشخصية.","o":["الأصول والمصروفات والمسحوبات الشخصية","الأصول والمصروفات والإيرادات","الأصول والخصوم والمسحوبات الشخصية","المصروفات والمسحوبات الشخصية ورأس المال"]},{"id":50,"lv":6,"q":"بحسب طبيعة الحسابات، ما هي الحسابات التي تُعد دائنة دائماً عند الزيادة؟","a":"الخصوم، حقوق الملكية (رأس المال)، والإيرادات.","o":["الخصوم وحقوق الملكية والإيرادات","الخصوم والإيرادات والمسحوبات الشخصية","الخصوم والمصروفات ورأس المال","حقوق الملكية والإيرادات والأصول"]},{"id":51,"lv":6,"q":"مفهوم: سجل الأستاذ (Ledger)","a":"سجل يجمع كافة الحسابات المالية للمنشأة لتبويب وتلخيص حركة كل حساب ومعرفة رصيده النهائي.","o":["سجل يجمع كافة الحسابات المالية للمنشأة لتبويب وتلخيص حركة كل حساب ومعرفة رصيده النهائي","سجل تُدوَّن فيه المعاملات المالية بالترتيب الزمني عند حدوثها لتحديد طرفي كل قيد","قائمة تضم أرصدة جميع الحسابات المدينة والدائنة للتأكد من توازنها الحسابي قبل إعداد القوائم","سجل يجمع حركة المخزون من وارد وصادر ورصيد لكل صنف على حدة لتحديد كمياته الفعلية"]},{"id":52,"lv":6,"q":"ما المقصود بعملية \"الترحيل\" (Posting) في الدورة المحاسبية؟","a":"نقل القيود المالية المسجلة في دفتر اليومية إلى الحسابات المخصصة لها في سجل الأستاذ.","o":["نقل القيود المسجلة في دفتر اليومية إلى الحسابات المخصصة لها في سجل الأستاذ","تسجيل المعاملات المالية لأول مرة في دفتر اليومية بعد تحليل المستندات المؤيدة","نقل أرصدة حسابات سجل الأستاذ إلى ميزان المراجعة للتأكد من توازنها","نقل أرصدة الحسابات المؤقتة إلى حساب ملخص الدخل في نهاية الفترة"]},{"id":53,"lv":6,"q":"ما هي الخطوة الأولى في الدورة المحاسبية؟","a":"جمع وتحليل المستندات المؤيدة للعمليات المالية لتحديد الطرف المدين والطرف الدائن.","o":["جمع وتحليل المستندات المؤيدة لتحديد الطرف المدين والطرف الدائن","تسجيل القيود في دفتر اليومية وفق الترتيب الزمني لحدوث العمليات","ترحيل القيود من دفتر اليومية إلى سجل الأستاذ لكل حساب","إعداد ميزان المراجعة قبل التسويات للتأكد من توازن الأرصدة"]},{"id":54,"lv":7,"q":"ما هو الهدف من إعداد \"ميزان المراجعة قبل التسويات\"؟","a":"التأكد من التوازن الحسابي لتساوي إجمالي الأرصدة المدينة مع إجمالي الأرصدة الدائنة في دفتر الأستاذ.","o":["التأكد من تساوي إجمالي الأرصدة المدينة مع إجمالي الأرصدة الدائنة في دفتر الأستاذ","التأكد من صحة جميع القيود المسجلة في دفتر اليومية وخلوها من الأخطاء المحاسبية","تحديد صافي الربح أو الخسارة للفترة المحاسبية قبل إعداد القوائم المالية","إثبات تعديلات الاستحقاق والتقديم على الإيرادات والمصروفات في نهاية الفترة"]},{"id":55,"lv":7,"q":"هل عدم اتزان ميزان المراجعة دليل قاطع على وجود أخطاء؟","a":"نعم، ولكن اتزانه ليس دليلاً قاطعاً على صحة الحسابات لعدم كشفه لأخطاء مثل أخطاء الحذف الكامل أو التكرار.","o":["نعم، لكن اتزانه ليس دليلاً قاطعاً على صحة الحسابات لأنه لا يكشف الحذف الكامل أو التكرار","لا، فعدم الاتزان قد ينتج عن اختلاف في طريقة العرض والتبويب لا عن أخطاء فعلية في القيود","نعم، كما أن اتزانه دليل قاطع على صحة جميع الحسابات وخلوها من أي أخطاء محاسبية","لا، لأن ميزان المراجعة لا يُعد لاكتشاف الأخطاء بل لتلخيص أرصدة الحسابات"]},{"id":56,"lv":7,"q":"ما هو الأساس المحاسبي المتبع عند تسجيل قيود التسويات الجردية للإيرادات والمصروفات؟","a":"مبدأ الاستحقاق، حيث تُسجل الإيرادات والمصروفات الخاصة بالفترة بغض النظر عن تحصيلها أو دفعها نقداً.","o":["مبدأ الاستحقاق، حيث تُسجل إيرادات ومصروفات الفترة بغض النظر عن تحصيلها أو دفعها نقداً","الأساس النقدي، حيث تُسجل الإيرادات والمصروفات عند تحصيلها أو دفعها نقداً فعلياً","مبدأ التكلفة التاريخية، حيث تُسجل الأصول بتكلفة الحصول عليها وقت الشراء دون تعديل","مبدأ الحيطة والحذر، حيث تُسجل الخسائر المتوقعة ولا تُسجل الأرباح المتوقعة قبل تحققها"]},{"id":57,"lv":7,"q":"ما هي الحسابات التي يتم إغلاقها في نهاية الفترة المحاسبية (الحسابات المؤقتة)؟","a":"إيرادات ومصروفات الفترة المحاسبية (حسابات قائمة الدخل) بالإضافة إلى حساب المسحوبات الشخصية.","o":["إيرادات ومصروفات الفترة (حسابات قائمة الدخل) بالإضافة إلى حساب المسحوبات الشخصية","إيرادات ومصروفات الفترة (حسابات قائمة الدخل) دون حساب المسحوبات الشخصية أو رأس المال","الأصول المتداولة والخصوم المتداولة بالإضافة إلى حساب المسحوبات الشخصية في نهاية الفترة","إيرادات الفترة وحساب رأس المال والمسحوبات الشخصية في نهاية الفترة المحاسبية"]},{"id":58,"lv":7,"q":"ما الفرق بين الحسابات الدائمة والحسابات المؤقتة؟","a":"الحسابات الدائمة (الأصول والخصوم وحقوق الملكية) تُرحل أرصدتها للفترات التالية، بينما المؤقتة تُقفل رصيدها في نهاية الفترة.","o":["الدائمة (الأصول والخصوم وحقوق الملكية) تُرحَّل أرصدتها للفترات التالية، والمؤقتة تُقفل أرصدتها في نهاية الفترة","الدائمة تُقفل أرصدتها في نهاية الفترة، والمؤقتة (الأصول والخصوم وحقوق الملكية) تُرحَّل أرصدتها للفترات التالية","الدائمة تشمل الأصول والخصوم وتُرحَّل أرصدتها، أما حقوق الملكية والمؤقتة فتُقفل أرصدتها في نهاية الفترة","الفرق في طريقة العرض لا في المعالجة، فكلتاهما تُقفل أرصدتها في نهاية الفترة ويُفتتح بها دفتر جديد"]},{"id":59,"lv":7,"q":"أذكر أنواع الأخطاء المحاسبية التي قد تحُدث رغم توازن ميزان المراجعة.","a":"أخطاء الحذف الكامل للعملية، أخطاء التكرار، أخطاء تسجيل مبالغ خاطئة في الطرفين، وأخطاء التوجيه المحاسبي (القواعد).","o":["الحذف الكامل للعملية، والتكرار، وتسجيل مبالغ خاطئة في الطرفين، وأخطاء التوجيه المحاسبي","الحذف الكامل للعملية، والتكرار، وترحيل أحد طرفي القيد دون الآخر، وأخطاء الجمع","ترحيل أحد طرفي القيد دون الآخر، وأخطاء الجمع في الأعمدة، ونقل الرصيد إلى الجانب الخطأ","الحذف الكامل للعملية، والتكرار، وأخطاء الجمع في الأعمدة، وأخطاء التوجيه المحاسبي"]},{"id":60,"lv":8,"q":"ما الفرق بين \"التحليل الرأسي\" و\"التحليل الأفقي\" للقوائم المالية؟","a":"التحليل الرأسي يحدد نسبة كل عنصر بالنسبة للمجموع الكلي في فترة واحدة، بينما الأفقي يقارن حركة العناصر عبر فترات زمنية متتابعة.","o":["الرأسي يحدد نسبة كل عنصر إلى المجموع الكلي في فترة واحدة، والأفقي يقارن العناصر عبر فترات زمنية متتابعة","الرأسي يقارن العناصر عبر فترات زمنية متتابعة، والأفقي يحدد نسبة كل عنصر إلى المجموع الكلي في فترة واحدة","الرأسي يقارن قوائم المنشأة بقوائم المنشآت المنافسة، والأفقي يقارنها بالموازنة التقديرية","الرأسي يحلل بنود الميزانية العمومية في كل فترة، والأفقي يحلل بنود قائمة الدخل في كل فترة"]},{"id":61,"lv":8,"q":"قارن بين الربح الإجمالي والربح التشغيلي.","a":"الربح الإجمالي يمثل المبيعات مطروحاً منها تكلفة المبيعات، بينما الربح التشغيلي يطرح المصاريف التشغيلية أيضاً من الربح الإجمالي.","o":["الربح الإجمالي هو المبيعات مطروحاً منها تكلفة المبيعات، والتشغيلي يطرح منه المصاريف التشغيلية أيضاً","الربح الإجمالي هو المبيعات مطروحاً منها المصاريف التشغيلية، والتشغيلي يطرح منه تكلفة المبيعات أيضاً","الربح الإجمالي هو المبيعات مطروحاً منها تكلفة المبيعات، والتشغيلي يطرح منه الفوائد والضرائب أيضاً","الربح الإجمالي هو المبيعات مطروحاً منها تكلفة المبيعات، والتشغيلي يضاف إليه الإيرادات الأخرى أيضاً"]},{"id":62,"lv":8,"q":"قارن بين الربح التشغيلي وصافي الربح.","a":"الربح التشغيلي يعكس أداء النشاط الرئيسي قبل الفوائد والضرائب، بينما صافي الربح هو الناتج بعد استقطاع كافة التكاليف والضرائب والبنود غير التشغيلية.","o":["التشغيلي يعكس أداء النشاط الرئيسي قبل الفوائد والضرائب، وصافي الربح هو الناتج بعد استقطاع كافة التكاليف والضرائب","التشغيلي يعكس أداء النشاط الرئيسي بعد الفوائد والضرائب، وصافي الربح هو الناتج قبل استقطاع التكاليف والضرائب","التشغيلي يشمل الإيرادات والمصروفات الأخرى غير التشغيلية، وصافي الربح يقتصر على نتائج النشاط الرئيسي","التشغيلي يعكس أداء النشاط الرئيسي قبل المصاريف التشغيلية، وصافي الربح هو الناتج بعد استقطاع هذه المصاريف"]},{"id":63,"lv":8,"q":"ما الفرق بين التدفق النقدي التشغيلي والتدفق النقدي الحر؟","a":"التدفق التشغيلي يحسب النقد الناتج من الأنشطة التشغيلية فقط، بينما التدفق الحر يمثل النقد المتاح بعد خصم النفقات الاستثمارية والرأسمالية.","o":["التشغيلي يحسب النقد الناتج من الأنشطة التشغيلية، والحر هو النقد المتاح بعد خصم النفقات الرأسمالية","التشغيلي هو النقد المتاح بعد خصم النفقات الرأسمالية، والحر يحسب النقد الناتج من الأنشطة التشغيلية","التشغيلي يحسب النقد من الأنشطة التشغيلية والاستثمارية معاً، والحر هو النقد من الأنشطة التمويلية","التشغيلي هو النقد المتاح بعد سداد الفوائد والضرائب، والحر هو النقد المتاح بعد توزيع الأرباح"]},{"id":64,"lv":8,"q":"قارن بين نظام المخزون الدوري ونظام المخزون المستمر.","a":"الدوري يحدد تكلفة المخزون برفع جرد فعلي بنهاية الفترة، أما المستمر فيحدث حساب المخزون وتكلفة المبيعات فور كل عملية بيع وشراء.","o":["الدوري يحدد التكلفة بجرد فعلي في نهاية الفترة، والمستمر يحدّث المخزون وتكلفة المبيعات مع كل عملية بيع وشراء","الدوري يحدّث المخزون وتكلفة المبيعات مع كل عملية بيع وشراء، والمستمر يحدد التكلفة بجرد فعلي في نهاية الفترة","الدوري يحدّث رصيد المخزون عند عمليات البيع، والمستمر يحدّث رصيد المخزون عند عمليات الشراء","الدوري يُستخدم في الشركات الصناعية بحكم تعقيد عملياتها، والمستمر يُستخدم في الشركات التجارية"]},{"id":65,"lv":8,"q":"ما الفرق في المعالجة بين المصروفات التشغيلية والمصروفات غير التشغيلية؟","a":"المصروفات التشغيلية ترتبط بالنشاط الإداري والتسويقي اليومي، بينما غير التشغيلية ترتبط بتمويل المنشأة أو خسائر غير تكرارية كالفوائد والأنشطة العرضية.","o":["التشغيلية ترتبط بالنشاط الإداري والتسويقي اليومي، وغير التشغيلية بتمويل المنشأة أو الخسائر غير المتكررة كالفوائد","التشغيلية ترتبط بتمويل المنشأة أو الخسائر غير المتكررة كالفوائد، وغير التشغيلية بالنشاط الإداري والتسويقي اليومي","التشغيلية هي المصروفات النقدية التي تُدفع فوراً، وغير التشغيلية هي المصروفات غير النقدية كالإهلاك","التشغيلية هي التي تُدفع خلال الفترة الحالية، وغير التشغيلية هي التي تُؤجَّل للفترة التالية"]},{"id":66,"lv":8,"q":"تُعرف العملية التي يُوزّع فيها الأصل الثابت على عمره الإنتاجي بـ _____ .","a":"الإهلاك (Depreciation)","o":["الإهلاك (Depreciation)","الاضمحلال (Impairment)","الإطفاء (Amortization)","إعادة التقييم (Revaluation)"],"n":"الإهلاك يوزّع تكلفة الأصل على عمره الإنتاجي، أما الاضمحلال فهو انخفاض القيمة عن القيمة القابلة للاسترداد."},{"id":67,"lv":8,"q":"المعيار الدولي الذي يتناول موضوع \"الاعتراف بالإيراد من العقود مع العملاء\" هو _____ .","a":"IFRS 15","o":["IFRS 15","IFRS 13","IFRS 9","IFRS 16"],"n":"المبدأ الأساسي في IFRS 15: يُعترف بالإيراد عند الوفاء بالتزامات الأداء ونقل السيطرة إلى العميل.","r":"IFRS 15: الاعتراف بالإيراد من العقود مع العملاء"},{"id":68,"lv":8,"q":"يتكون نظام القيد المزدوج من طرفين هما الطرف _____ والطرف _____ .","a":"المدين / الدائن","o":["المدين / الدائن","الأصل / الخصم","الإيراد / المصروف","النقدي / الآجل"],"n":"كل عملية مالية لها طرفان متساويان في القيمة: مدين (يأخذ) ودائن (يعطي)."},{"id":69,"lv":8,"q":"السعر الذي يُحصل لبيع أصل في معاملة منظمة يسمى القيمة _____ وفق المعيار IFRS 13.","a":"العادلة","o":["العادلة","الدفترية","التاريخية","القابلة للاسترداد"],"n":"وفق IFRS 13: القيمة العادلة هي السعر المستلم لبيع أصل أو المدفوع لنقل التزام في معاملة منظمة بين مشاركين في السوق.","r":"IFRS 13: قياس القيمة العادلة"},{"id":70,"lv":6,"q":"ما الدفتر الأول الذي تُدون فيه المعاملات المالية بالترتيب الزمني؟","a":"دفتر اليومية العامة.","o":["دفتر اليومية العامة","دفتر الأستاذ العام","ميزان المراجعة","دفتر الأستاذ المساعد"],"n":"تُدوَّن فيه العمليات بالترتيب الزمني أولاً، ثم تُرحَّل إلى سجل الأستاذ."},{"id":71,"lv":2,"q":"إذا اشترت الشركة أثاثاً بمبلغ 100,000 ريال نقداً، فما هو القيد المحاسبي لهذه العملية؟","a":"من حـ/ الأثاث 100,000 إلى حـ/ النقدية 100,000.","o":["من حـ/ الأثاث 100,000 إلى حـ/ النقدية 100,000","من حـ/ مصروفات الأثاث 100,000 إلى حـ/ النقدية 100,000","من حـ/ النقدية 100,000 إلى حـ/ الأثاث 100,000","من حـ/ الأثاث 100,000 إلى حـ/ الدائنون 100,000"]},{"id":72,"lv":2,"q":"إذا اشترت الشركة لوازم مكتبية بقيمة 50,000 ريال على الحساب، فما طرفا القيد المحاسبي؟","a":"الطرف المدين: حـ/ اللوازم المكتبية (50,000)، والطرف الدائن: حـ/ الدائنون (أو الموردون) (50,000).","o":["الطرف المدين: حـ/ اللوازم المكتبية (50,000)، والطرف الدائن: حـ/ الدائنون أو الموردون (50,000)","الطرف المدين: حـ/ اللوازم المكتبية (50,000)، والطرف الدائن: حـ/ النقدية (50,000)","الطرف المدين: حـ/ الدائنون (50,000)، والطرف الدائن: حـ/ اللوازم المكتبية (50,000)","الطرف المدين: حـ/ المدينون (50,000)، والطرف الدائن: حـ/ اللوازم المكتبية (50,000)"]},{"id":73,"lv":7,"q":"ما هي طبيعة حساب \"المبيعات\" وحساب \"مردودات المبيعات\"؟","a":"حساب المبيعات طبيعته دائنة، بينما حساب مردودات ومسموحات المبيعات طبيعته مدينة.","o":["حساب المبيعات طبيعته دائنة، بينما حساب مردودات ومسموحات المبيعات طبيعته مدينة","حساب المبيعات طبيعته مدينة، بينما حساب مردودات ومسموحات المبيعات طبيعته دائنة","كلاهما طبيعته دائنة لأن مردودات المبيعات تُصنَّف ضمن الإيرادات","المبيعات طبيعتها مدينة لأنها تزيد الأصول، ومردوداتها طبيعتها دائنة لأنها تنقصها"]},{"id":74,"lv":7,"q":"كيف يؤثر مصروف الإهلاك على القوائم المالية عند إعداد التسويات؟","a":"يظهر مصروف الإهلاك في قائمة الدخل كمصروف تشغيلي، ويظهر مجمع الإهلاك في الميزانية كحساب أصل مخصوم من الأصل الثابت.","o":["يظهر مصروف الإهلاك في قائمة الدخل كمصروف تشغيلي، ويظهر مجمع الإهلاك في الميزانية كحساب أصل مخصوم من الأصل الثابت","يظهر مصروف الإهلاك في الميزانية مخصوماً من الأصل الثابت، ويظهر مجمع الإهلاك في قائمة الدخل كمصروف تشغيلي","يظهر مصروف الإهلاك في قائمة الدخل كمصروف تشغيلي، ويظهر مجمع الإهلاك في الميزانية ضمن الخصوم المتداولة","يظهر مصروف الإهلاك في قائمة الدخل ضمن المصروفات الأخرى، ويظهر مجمع الإهلاك في الميزانية ضمن حقوق الملكية"]},{"id":75,"lv":7,"q":"ما هو الحساب الوسيط الذي يُستخدم لإقفال الإيرادات والمصروفات في نهاية السنة المالية؟","a":"حساب ملخص الدخل (أو أرباح وخسائر).","o":["حساب ملخص الدخل (أو أ /* ---------------- confetti ---------------- */
const fx = $('#fx'), fxc = fx.getContext('2d');
let parts = [], fxRun = false;
function fitFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
fitFx(); addEventListener('resize', fitFx);
function confetti(x, y, n, spread, power) {
  if (reduced()) return;
  const cols = ['#34D3A1', '#F5C04A', '#86ABFF', '#FFFFFF', '#FF8173', '#5BE3B8'];
  for (let i = 0; i < n; i++) {
    const a = (-Math.PI / 2) + (Math.random() - .5) * spread, v = (Math.random() * .6 + .5) * power;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: .22 + Math.random() * .1, s: 5 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: pick(cols), life: 90 + Math.random() * 50, sh: Math.random() > .5 });
  }
  if (!fxRun) { fxRun = true; requestAnimationFrame(stepFx); }
}
function stepFx() {
  fxc.clearRect(0, 0, fx.width, fx.height);
  const k = devicePixelRatio;
  parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
  parts.forEach(p => {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life--;
    fxc.save(); fxc.translate(p.x * k, p.y * k); fxc.rotate(p.r); fxc.globalAlpha = Math.min(1, p.life / 30);
    fxc.fillStyle = p.c;
    if (p.sh) fxc.fillRect(-p.s * k / 2, -p.s * k / 4, p.s * k, p.s * k / 2); else { fxc.beginPath(); fxc.arc(0, 0, p.s * k / 3, 0, 7); fxc.fill(); }
    fxc.restore();
  });
  if (parts.length) requestAnimationFrame(stepFx); else { fxRun = false; fxc.clearRect(0, 0, fx.width, fx.height); }
}
function bigConfetti() { confetti(innerWidth * .2, innerHeight * .7, 70, 1.6, 15); confetti(innerWidth * .8, innerHeight * .7, 70, 1.6, 15); setTimeout(() => confetti(innerWidth * .5, innerHeight * .6, 90, 2.2, 17), 220); }

function answer(k) {
  const c = cur(); if (!c) return;
  const it = c.items[c.i]; if (it.pick !== null) return;
  let left = 0;

  const elapsed = TM ? TIME_LIMIT - left : 0;
  stopTimer();
  it.pick = k < 0 ? -1 : it.perm[k]; it.t = Math.round(elapsed);
  const ok = it.pick === 0;
  S.stats.answered++;
  if (ok) {
    S.stats.correct++; c.streak++; S.stats.bestStreak = Math.max(S.stats.bestStreak, c.streak);
    const sb = c.streak >= 2 ? Math.min(c.streak - 1, 5) * 2 : 0;
    const sp = c.mode === 'challenge' ? Math.round(left / TIME_LIMIT * 5) : 0;
    it.xp = Math.max(4, 10 + sb + sp - (it.hid.length ? 3 : 0)); c.xp += it.xp;
    if (c.mode === 'challenge' && elapsed <= 10) S.stats.fast++;

    c.streak = 0;
    it.msg = k < 0 ? TIME_MSG : (S.instant ? pick(BAD_MSGS) : NEUTRAL_MSG);

  if (!S.instant && k >= 0) it.msg = NEUTRAL_MSG;
  save();
  redrawQuiz(false, true);
  const card = $('#qcard');

  else if (S.instant) {

      if (it.xp && card) { const p = document.createElement('span'); p.className = 'xp-pop'; p.textContent = '+' + it.xp; card.appendChild(p); setTimeout(() => p.remove(), 1200); }
    } else { SND.bad(); if (card && !reduced()) { card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 500); } }
  } else tone(520, .08, 'sine', .04);
}

  x.strokeStyle = '#E3A92B'; x.lineWidth = 3; x.beginPath(); x.moveTo(W / 2 - 330, 670); x.lineTo(W / 2 + 330, 670); x.stroke();
  x.fillStyle = '#26413B'; x.font = '500 46px ' + F_B;

  const cx = W / 2, cy = 1010; x.fillStyle = '#E3A92B'; x.beginPath(); for (let k = 0; k < 24; k++) { const r = k % 2 ? 66 : 80, a = k * Math.PI / 12; x.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } x.closePath(); x.fill();
  x.fillStyle = '#0B7F63'; x.beginPath(); x.arc(cx, cy, 56, 0, 7); x.fill(); drawLogo(x, cx, cy, 52, false); x.save(); x.globalCompositeOperation = 'source-over'; x.restore();

function showImage(canvas, name, title, shareText) {
  const url = canvas.toDataURL('image/png');
  modal(`<div class="sheet-h"><h2>${esc(title)}</h2><button class="icon-btn x" data-act="close" aria-label="إغلاق">${ic('x')}</button></div><img class="pv" src="${url}" alt="${esc(title)}">
  <div class="res-act"><button class="btn btn-primary" data-act="dl">${ic('download')} حمّل الصورة</button><button class="btn btn-soft" data-act="sharenow">${ic('share')} شارك</button><button class="btn btn-ghost" data-act="copytxt">نسخ النص</button></div>`, 'wide');
  window.__img = { canvas, name, shareText };
}
async function doShare() {
  const o = window.__img; if (!o) return;
  o.canvas.toBlob(async b => {
    const f = new File([b], o.name, { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], text: o.shareText, title: BRAND }); return; }
      if (navigator.share) { await navigator.share({ text: o.shareText, title: BRAND, url: siteURL() || undefined }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    copyText(o.shareText); toast('تم نسخ نص المشاركة', 'الصق النص مع الصورة المحمَّلة', 'share');
  }, 'image/png');
}
function copyText(t) { try { navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (_) {} a.remove(); } }
function download() { const o = window.__img; if (!o) return; const a = document.createElement('a'); a.download = o.name; a.href = o.canvas.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove(); }
async function shareLevel(lv) {
  const r = S.res[lv] || (FRESH && FRESH.lv === lv && FRESH.attempt); if (!r) return;
  const rk = rankOf(S.xp).r.n, cv = await makeShareCard({ kicker: 'نتيجتي في اختبار المحاسبة', title: 'المستوى ' + lv + ': ' + LV[lv - 1].n, pct: r.pct, sub: r.correct + ' من ' + r.total + ' إجابة صحيحة', stars: r.stars, rank: rk, name: S.name });
  showImage(cv, 'mizan-level-' + lv + '.png', 'بطاقة مشاركة نتيجتك', `حصلت على ${r.pct}% في «${LV[lv - 1].n}» على ميزان، ورتبتي الآن: ${rk}. ${TAGLINE}. ${siteURL()}`.trim());
}
async function shareFinal() {
  const T = totals(); if (!T.all) return; const rk = rankOf(S.xp).r.n;
  const cv = await makeShareCard({ kicker: 'نتيجتي الإجمالية في اختبار المحاسبة', title: 'أنهيت المستويات الثمانية', pct: T.pct, sub: T.c + ' من ' + T.t + ' إجابة صحيحة', grade: gradeOf(T.pct), rank: rk, name: S.name });
  showImage(cv, 'mizan-final.png', 'بطاقة مشاركة نتيجتك الإجمالية', `أنهيت كل مستويات ميزان للمحاسبة بنتيجة ${T.pct}% وتقدير «${gradeOf(T.pct)}»، ورتبتي: ${rk}. ${TAGLINE}. ${siteURL()}`.trim());

async function showCert() {
  const T = totals(); if (!T.all) return;

  const cv = await makeCert({ name: S.name, pct: T.pct, total: T.t, grade: gradeOf(T.pct), rank: rankOf(S.xp).r.n, date: new Date().toLocaleDateString('ar-u-nu-latn', { year: 'numeric', month: 'long', day: 'numeric' }) });
  showImage(cv, 'mizan-certificate.png', 'شهادتك', `حصلت على شهادة إتمام «ميزان» للمحاسبة بنتيجة ${T.pct}%. ${TAGLINE}. ${siteURL()}`.trim());

/* =====================================================================

document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.close && e.target.classList.contains('ov')) return closeModal();
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, lv = +t.dataset.lv;
  switch (a) {
    case 'go': if (t.getAttribute('aria-disabled') === 'true') { toast('مقفلة', 'أنهِ المستويات الثمانية أولاً', 'lock'); return; } go(t.dataset.to); break;
    case 'theme': S.theme = isDark() ? 'light' : 'dark'; save(); applyTheme(); break;
    case 'sound': S.sound = !S.sound; save(); applyTheme(); if (S.sound) SND.ok(); break;
    case 'settings': openSettings(); break;
    case 'close': closeModal(); break;
    case 'settheme': S.theme = t.dataset.t; save(); applyTheme(); $$('[data-act=settheme]').forEach(b => b.classList.toggle('on', b === t)); break;
    case 'toggle': S[t.dataset.k] = !S[t.dataset.k]; save(); t.setAttribute('aria-checked', S[t.dataset.k]); applyTheme(); break;
    case 'reset': if (confirm('سيتم مسح كل نتائجك ونقاطك وإنجازاتك. هل أنت متأكد؟')) { S = DEF(); save(); closeModal(); applyTheme(); go('#/'); render(); } break;
    case 'open': {
      const c = cur();
      if (c) { if (!confirm(c.lv === lv ? 'لديك تقدّم محفوظ في هذا المستوى وسيُمسح عند البدء من جديد. هل تريد المتابعة؟' : 'لديك مستوى غير مكتمل. بدء مستوى جديد سيلغي تقدّمك فيه. هل تريد المتابعة؟')) return; }
      pendingMode = S.mode || 'practice'; openLevel(lv); break;
    }
    case 'mode': pendingMode = t.dataset.m; $$('#modeSel button').forEach(b => b.classList.toggle('on', b === t)); break;
    case 'begin': { const m = pendingMode || 'practice'; closeModal(); startLevel(lv, m); break; }
    case 'resume': go('#/quiz'); break;
    case 'exit': stopTimer(); toast('تم حفظ تقدّمك', 'ستجد زر «تابع» لتكمل من حيث توقفت', 'check'); go('#/map'); break;
    case 'pick': answer(+t.dataset.k); break;
    case 'fifty': fifty(); break;
    case 'next': nextQ(); break;
    case 'filter': rvFilter = t.dataset.f; { const r = FRESH && FRESH.lv === +route().arg ? FRESH.attempt : S.res[+route().arg]; $$('.tab').forEach(b => b.setAttribute('aria-selected', b === t)); $('#rvlist').innerHTML = reviewHTML(r, rvFilter); } break;
    case 'sharelv': shareLevel(lv); break;
    case 'sharefinal': shareFinal(); break;
    case 'cert': showCert(); break;
    case 'dl': download(); break;
    case 'sharenow': doShare(); break;
    case 'copytxt': copyText((window.__img || {}).shareText || ''); toast('تم نسخ النص', '', 'check'); break;
    case 'deck': DECK = { lv, sh: DECK.sh, i: 0, flip: false, ids: null }; render(); break;
    case 'shuf': DECK.sh = !DECK.sh; DECK.ids = null; DECK.i = 0; DECK.flip = false; render(); break;
    case 'flip': DECK.flip = !DECK.flip; $('#fc').classList.toggle('flip', DECK.flip); break;
    case 'know': { const id = deckIds()[DECK.i]; S.known[id] = 1; const nb = checkBadges(); save(); nb.forEach(b => toast('إنجاز جديد: ' + b.n, b.d, b.ic)); studyMove(1); break; }
    case 'unknow': { const id = deckIds()[DECK.i]; delete S.known[id]; save(); studyMove(1); break; }
    case 'nextcard': studyMove(1); break;
    case 'prev': studyMove(-1); break;
    case 'mkf': mkFilter = lv; render(); break;
    case 'master': { const id = +t.dataset.id; if (S.mastered[id]) delete S.mastered[id]; else S.mastered[id] = 1; save(); render(); break; }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'nameInp') { S.name = e.target.value.trim(); save(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modalRoot .ov')) { closeModal(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/INPUT|TEXTAREA/.test((e.target || {}).tagName || '')) return;
  const r = route();
  if (r.name === 'quiz' && cur()) {
    const m = { '1': 0, '2': 1, '3': 2, '4': 3, '١': 0, '٢': 1, '٣': 2, '٤': 3 };
    if (e.key in m) { answer(m[e.key]); }

  } else if (r.name === 'study' && !$('#modalRoot .ov')) {

addEventListener('hashchange', render);
